name: CI & Deploy

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run audit:contrast
      - run: npm test
      - run: npm run build

  # NO browser e2e here, deliberately. Every Playwright spec — including the
  # multi-context social ones (lobby / two-players / spectate) — lives in
  # e2e.yml, which also owns the Chromium download those runs need. This job is
  # static checks + unit tests + build: no browsers, no wrangler dev, no
  # multi-client room orchestration, so it stays cheap on every push and PR.
  #
  # Deploy is gated on that fast `ci` job only, so a merge reaches prod in a
  # couple of minutes. The trade is real and accepted: a regression that only a
  # browser catches can ship. Three things cover it, none of them blocking —
  # the deploy proves itself against the LIVE site (verify-deploy.ts below),
  # e2e.yml re-runs the full suite on this exact commit as soon as THIS
  # workflow succeeds on main (workflow_run), and it runs again nightly.
  deploy:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler d1 migrations apply jaffre --remote
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Tee the deploy log to capture the workers.dev URL: the custom domain's
      # bot protection 403s plain fetches from runner IPs, so verify-deploy.ts
      # falls back to the same worker's WAF-free workers.dev host when blocked.
      - run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "DEPLOY_FALLBACK_URL=$url" >> "$GITHUB_ENV"
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Green CI is not a deploy: prove the LIVE site serves this exact commit.
      - run: npx tsx scripts/verify-deploy.ts
