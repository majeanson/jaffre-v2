name: E2E (Playwright)

# The ONLY place browser tests run. ci.yml deliberately installs no browser and
# runs no Playwright spec, so every cost of a real browser — the Chromium
# download, wrangler dev, the multi-client room orchestration in
# lobby/two-players/spectate — is paid here and nowhere else. The suite is slow
# (~5 min) and mostly catches what static checks and unit tests can't, so it
# runs nightly and on demand rather than blocking a deploy.
#
# Because nothing gates prod on this, run it on demand (the "Run workflow"
# button) before anything risky, and read the nightly result.
on:
  schedule:
    # 06:00 UTC daily (low-traffic). Cron uses UTC; adjust if the window shifts.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
      # Telemetry beacons otherwise vanish into Workers Logs that nobody reads;
      # print the last-7-days digest into this nightly job's log where a human
      # will see it. The custom domain sits behind the zone's bot protection,
      # which 403s plain curl from runner IPs (see verify-deploy.ts), so this
      # tries the same worker's WAF-free workers.dev host first. Never fails
      # the job — purely informational.
      - name: Telemetry digest
        if: always()
        run: |
          curl -s --max-time 20 https://jaffre.marc-jeanson.workers.dev/api/telemetry/summary || true
          curl -s --max-time 20 https://jaffre.marcportal.com/api/telemetry/summary || true
