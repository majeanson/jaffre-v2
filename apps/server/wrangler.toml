# Jaffre — Cloudflare Worker
# Account selected at deploy time via CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN.
name = "jaffre"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

routes = [{ pattern = "jaffre.marcportal.com", custom_domain = true }]

# Workers Logs is OPT-IN. Without this block every console.error in this
# codebase — the rating guard, history persistence, alarm failures, the
# first-party client telemetry beacons — existed only inside a live
# `wrangler tail` and was gone the moment you closed it. A player reporting
# "my game froze last night" was unanswerable by construction.
#
# Sampling stays at 1: this is a small game, the log volume is a handful of
# lines per finished game plus real errors, and a sampled-away error during
# the one incident you care about is a false economy. Lower it if a flood
# ever shows up in billing.
[observability]
enabled = true
head_sampling_rate = 1

[assets]
binding = "ASSETS"
directory = "../web/dist"
not_found_handling = "single-page-application"
# Without this, the SPA fallback serves index.html (200) for any unmatched path
# that looks like an HTML navigation — which swallows browser-navigated API GETs
# like /api/auth/google (the Google-link start URL) and /api/auth/google/callback,
# so OAuth silently bounced back to the homepage. Force the Worker to run first
# for API + WebSocket routes; everything else still hits static assets first.
run_worker_first = ["/api/*", "/ws/*"]

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" },
  { name = "LOBBY", class_name = "Lobby" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# D1 (M8: accounts + history). SESSION_SECRET is a wrangler secret
# (`wrangler secret put SESSION_SECRET`, `.dev.vars` locally) — see src/env.ts
# for the no-secret fallback behaviour.
[[d1_databases]]
binding = "DB"
database_name = "jaffre"
database_id = "ac79cf61-e214-405a-ae67-a9308dcd97d3"
migrations_dir = "migrations"
