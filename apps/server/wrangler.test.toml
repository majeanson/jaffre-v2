# Test-only wrangler config for @cloudflare/vitest-pool-workers.
# Identical to wrangler.toml minus the [assets] binding: the assets directory
# (../web/dist) may not exist in CI and is irrelevant to room tests.
name = "jaffre"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "GAME_ROOM", class_name = "GameRoom" },
  { name = "LOBBY", class_name = "Lobby" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]

# D1 for tests: miniflare fakes the database locally (the id is a placeholder,
# never a real Cloudflare resource). Schema is applied per-run by
# test/apply-migrations.ts via applyD1Migrations.
[[d1_databases]]
binding = "DB"
database_name = "jaffre"
database_id = "jaffre-test"
migrations_dir = "migrations"
